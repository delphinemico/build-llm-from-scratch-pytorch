[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "build-llm-from-scratch-pytorch"
version = "0.1.0"
description = "Personal notebooks, scripts, notes, and exercises created while studying large language models from scratch with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools]
py-modules = []